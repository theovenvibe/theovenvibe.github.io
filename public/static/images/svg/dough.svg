<!--
  The Dough coin.

  A coin, not a gem: the currency is called Dough because it is money and it is
  bread, and the shape has to say "this is worth rupees" at 24px in a chat list
  before it says anything clever. The rupee mark is the only detail that
  survives at that size, so it carries the meaning; the dashed crust ring and
  the two bubbles read as baked rather than minted when shown larger.

  The mark is a text glyph, not a hand-drawn path: a path traced by eye came out
  misshapen, and a currency symbol that looks almost right is worse than a plain
  circle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Dough">
  <circle cx="24" cy="24" r="22" fill="#E8A33D"/>
  <circle cx="24" cy="24" r="22" fill="none" stroke="#C67C1E" stroke-width="2"/>
  <circle cx="24" cy="24" r="17.5" fill="none" stroke="#F3C77B" stroke-width="1.8" stroke-dasharray="3 4" stroke-linecap="round"/>
  <circle cx="13.5" cy="15.5" r="1.9" fill="#F7DCA8"/>
  <circle cx="34" cy="32" r="1.4" fill="#F7DCA8"/>
  <text x="24" y="24" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="700" fill="#6B3A0B">₹</text>
</svg>
