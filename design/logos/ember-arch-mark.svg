<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Oven Vibe mark — oven arch with ember">
  <!-- Ember Arch compact mark: oven-door arch + glowing ember. Pure paths, favicon-safe. -->
  <rect width="64" height="64" rx="14" fill="#191411"/>
  <!-- arch: outer silhouette minus inner opening (even-odd) -->
  <path fill="#F5EDE3" fill-rule="evenodd" d="
    M14 54 L14 30 A18 18 0 0 1 50 30 L50 54 L41 54 L41 31
    A9 9 0 0 0 23 31 L23 54 Z"/>
  <!-- ember glow -->
  <circle cx="32" cy="46" r="9" fill="#F5A83C" opacity="0.28"/>
  <circle cx="32" cy="46" r="5" fill="#F5A83C"/>
</svg>
