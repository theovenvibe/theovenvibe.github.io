name: Search health
on:
  schedule:
    - cron: '20 3 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-search-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:search
      - run: node scripts/audit-live-search.mjs
