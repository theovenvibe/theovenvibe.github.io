# Rebuild the static site after 21 Oct 2026 06:00 IST (00:30 UTC).
# The browser time gate hides the specials at the cutoff. GitHub scheduled
# jobs may start late; retries refresh the static HTML, menu.json and SEO.
name: expire Navaratri menu

on:
  schedule:
    - cron: '30,35,40,45,50,55 0 21 10 *'
    - cron: '0,15,30,45 1-3 21 10 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the one-time expiry window
        id: window
        shell: bash
        run: |
          node -e "const now = Date.now(); const ready = now >= Date.parse('2026-10-21T00:30:00Z') && now < Date.parse('2026-10-22T00:00:00Z'); console.log('ready=' + ready); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'ready=' + ready + '\n')"
      - if: steps.window.outputs.ready == 'true'
        run: npm ci
      - if: steps.window.outputs.ready == 'true'
        run: npm run build
      - if: steps.window.outputs.ready == 'true'
        run: npm run test:menu
      - if: steps.window.outputs.ready == 'true'
        run: npm run test:gallery
      - uses: actions/upload-pages-artifact@v3
        if: steps.window.outputs.ready == 'true'
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.window.outputs.ready == 'true'
