# CI: build check on every push/PR; deploy ONLY from main (PRD §5).
# main stays frozen serving v1 until the one-shot launch merge
# (skills/release-manager.md §7). The deploy job below only ever runs on
# main — "deploy: skipping" on develop/feature branches is normal.
#
# LAUNCH NOTE (Phase 6): repo currently uses branch-based Pages deploy.
# At launch, switch Settings → Pages → Source to "GitHub Actions" so this
# workflow's deploy job takes over. Until then it will fail/queue if run —
# which cannot happen, because main receives no pushes before launch.
name: ci

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build # astro check && astro build (Zod validates menu.json + site.config.json)
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
